<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let preference = null;
        try {
          const stored = localStorage.getItem('explorer-theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch {}
        const theme =
          preference ??
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0c0a09' : '#ffffff');
      })();
    </script>
    <meta
      name="description"
      content="Explore Zerospin's repositories, aggregate and service sessions, and Shared Worker storage."
    />
    <title>Zerospin · Explorer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
